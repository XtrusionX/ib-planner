<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>IB Planner</title><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="IB Planner"><meta name="theme-color" content="#2445d4"><link rel="apple-touch-icon" href="icon-180.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky header + scrollable tab strip; each view is a single column on phones, two columns on wide screens. Exam-hall cool paper, cobalt ink, highlighter for "now". */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --sunk:#e8ecf3; --ink:#141a26; --muted:#5a6477; --line:#d9dfe9;
  --accent:#2445d4; --accent-ink:#ffffff; --hi:#ffe14d; --hi-ink:#1b1a10;
  --red:#cf3d3d; --amber:#c98200; --green:#23894f;
  --red-bg:#fbe7e7; --amber-bg:#fdf0d6; --green-bg:#e1f3e8;
  --s-math:#2445d4; --s-econ:#c2410c; --s-glopol:#7c3aed; --s-eng:#0f766e; --s-phys:#0369a1; --s-fr:#be185d; --s-core:#57534e;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e121a; --surface:#161b26; --sunk:#1d2331; --ink:#e6eaf2; --muted:#97a1b4; --line:#2a3245;
  --accent:#8199ff; --accent-ink:#0b1020; --hi:#e6c835; --hi-ink:#16140a;
  --red:#ff7b7b; --amber:#f2b441; --green:#55c986;
  --red-bg:#3a1e22; --amber-bg:#3a2e15; --green-bg:#173323;
  --s-math:#8199ff; --s-econ:#fb8f5a; --s-glopol:#b49aff; --s-eng:#4fd1c0; --s-phys:#5ab8ef; --s-fr:#f472b6; --s-core:#b8b2ab;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e121a; --surface:#161b26; --sunk:#1d2331; --ink:#e6eaf2; --muted:#97a1b4; --line:#2a3245;
  --accent:#8199ff; --accent-ink:#0b1020; --hi:#e6c835; --hi-ink:#16140a;
  --red:#ff7b7b; --amber:#f2b441; --green:#55c986;
  --red-bg:#3a1e22; --amber-bg:#3a2e15; --green-bg:#173323;
  --s-math:#8199ff; --s-econ:#fb8f5a; --s-glopol:#b49aff; --s-eng:#4fd1c0; --s-phys:#5ab8ef; --s-fr:#f472b6; --s-core:#b8b2ab;
  color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:16px/1.5 var(--f-body);min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px 4px}
.brand{font:800 1.45rem/1 var(--f-display);letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px}
.brand small{font:600 .7rem var(--f-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font:600 .78rem var(--f-mono);background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.hot{background:var(--hi);color:var(--hi-ink)}
.save{font:400 .72rem var(--f-mono);color:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-block:4px 0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);font:700 .92rem var(--f-display);padding:8px 12px 10px;border-bottom:3px solid transparent}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

main{padding-block:20px 64px}
section.view{display:grid;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800;line-height:1.1}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:.95rem;font-weight:700}
.lede{color:var(--muted);margin:4px 0 0}
.label{font:600 .7rem var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.grid2{display:grid;gap:20px;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:700;font-size:.9rem}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 8px}
.btn.ghost:hover{color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
input[type=text],input[type=date],input[type=url],input[type=number],select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input[type=number]{width:3.4em;text-align:center;padding:5px 4px;font-family:var(--f-mono)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block;background:var(--c,var(--muted))}

/* today hero */
.hero{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) auto;align-items:end}
@media (max-width:620px){.hero{grid-template-columns:minmax(0,1fr)}}
.count{display:flex;gap:12px;align-items:center;background:var(--hi);color:var(--hi-ink);border-radius:var(--r);padding:10px 16px}
.count b{font:800 2.6rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.count span{font-size:.85rem;line-height:1.25}

/* timeline */
.tl{display:grid;gap:4px}
.blk{display:grid;grid-template-columns:4.6em 6px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 8px;border-radius:8px}
.blk .bar{align-self:stretch;border-radius:3px;background:var(--c,var(--line))}
.blk.brk{color:var(--muted);font-size:.88rem;padding-block:3px}
.blk.brk .bar{background:var(--line);width:2px;justify-self:center}
.blk.now{background:var(--sunk);outline:2px solid var(--hi);}
.blk.past{opacity:.5}
.blk .t{font:600 .8rem var(--f-mono);color:var(--muted)}
.blk .s{font-weight:700}

/* timer */
.timer{display:grid;gap:12px;justify-items:start}
.clock{font:600 clamp(2.8rem,9vw,4.2rem)/1 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.track{height:8px;border-radius:4px;background:var(--sunk);width:100%;overflow:hidden}
.track i{display:block;height:100%;background:var(--c,var(--accent));width:0;transition:width .4s linear}
.scrubwrap{width:100%;display:grid;gap:4px}
.track.scrub{position:relative;overflow:visible;height:10px;border-radius:5px;cursor:pointer;touch-action:none}
.track.scrub::before{content:"";position:absolute;inset:-12px 0}
.track.scrub i{border-radius:5px}
.track.scrub.drag i,.track.scrub.drag .knob{transition:none}
.knob{position:absolute;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--surface);border:3px solid var(--c,var(--accent));box-shadow:0 1px 4px rgba(0,0,0,.25);transition:left .4s linear,transform .15s;pointer-events:none}
.track.scrub:hover .knob,.track.scrub.drag .knob,.track.scrub:focus-visible .knob{transform:scale(1.2)}
.scrubhint{font:600 .76rem var(--f-mono);color:var(--muted);min-height:1.2em;opacity:0;transition:opacity .2s}
.scrubhint.on{opacity:1;color:var(--ink)}
.late{gap:6px}.late .label{margin-right:2px}
.chip-b{border:1px dashed var(--line);background:none;border-radius:999px;padding:3px 10px;font:600 .78rem var(--f-mono);color:var(--muted)}
.chip-b:hover{border-color:var(--c,var(--accent));color:var(--ink);border-style:solid}
.late input[type=time]{padding:4px 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* checklists */
.subj{border-top:1px solid var(--line);padding-top:10px}
.subj:first-child{border-top:0;padding-top:0}
.subj summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;font-weight:700}
.subj summary::-webkit-details-marker{display:none}
.subj summary .cnt{margin-left:auto;font:600 .75rem var(--f-mono);color:var(--muted)}
.subj summary::before{content:"▸";color:var(--muted);font-size:.8rem;transition:transform .15s}
.subj[open] summary::before{transform:rotate(90deg)}
ul.checks{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:2px}
.ck{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:5px 6px;border-radius:6px}
.ck:hover{background:var(--sunk)}
.ck input[type=checkbox]{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent)}
.ck.done .txt{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.ck .txt{overflow-wrap:anywhere}
.ck .x{opacity:0;border:0;background:none;color:var(--muted);padding:0 4px}
.ck:hover .x,.ck .x:focus-visible{opacity:1}
.tdacts{display:flex;gap:2px;align-items:center}
.tdacts .x:hover{color:var(--ink)}
.tdin{width:100%;padding:3px 8px!important}
@media (hover:none){.ck .x{opacity:.55}}
.add{display:flex;gap:6px;margin-top:6px}
.add input{flex:1}

/* week */
.week{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.week table{border-collapse:collapse;width:100%;min-width:760px}
.week th,.week td{padding:6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.week thead th{font:600 .7rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--sunk);white-space:nowrap}
.week tbody th{font:700 .95rem var(--f-display);white-space:nowrap}
.week tr.today th{background:var(--hi);color:var(--hi-ink)}
.week td.brk{color:var(--muted);font:400 .75rem var(--f-mono);text-align:center;background:var(--sunk)}
.week select{border-left:4px solid var(--c,var(--line));width:100%;padding:5px 6px;font-weight:700;font-size:.88rem}

/* week editor */
.daypick{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dp{display:grid;gap:2px;justify-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 4px}
.dp b{font:700 .95rem var(--f-display)}
.dp span{font:600 .7rem var(--f-mono);color:var(--muted)}
.dp.is-today b::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--hi);margin-left:4px;vertical-align:middle;box-shadow:0 0 0 1px var(--hi-ink)}
.dp[aria-selected="true"]{background:var(--ink);border-color:var(--ink)}
.dp[aria-selected="true"] b,.dp[aria-selected="true"] span{color:var(--bg)}
.blist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.brow{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto;gap:8px;align-items:center;border:1px solid var(--line);border-left:5px solid var(--c);border-radius:8px;padding:6px 8px;background:var(--surface)}
.brow.break{background:var(--sunk);border-left-color:var(--line)}
.brow.dragging{opacity:.4}
.brow.over{box-shadow:0 -3px 0 var(--accent)}
.grip{cursor:grab;color:var(--muted);font-size:1.1rem;user-select:none}
.mv{display:flex;flex-direction:column}
.mv .btn{padding:0 6px;font-size:.7rem;line-height:1.3}
.what select{width:100%;font-weight:700}
.brkname{font-weight:700;color:var(--muted)}
.len{display:flex;align-items:center;gap:2px}
.len .u{font:600 .72rem var(--f-mono);color:var(--muted);margin-right:2px}
.len .btn{padding:2px 8px;font-size:1rem}
.del{padding:4px 6px}
@media (max-width:520px){.brow{grid-template-columns:auto minmax(0,1fr) auto;row-gap:4px}.grip{display:none}.what{grid-column:2/4}.mv{grid-row:1/3;flex-direction:column}.len{grid-column:2}.del{grid-column:3;grid-row:2}}
.copybox{display:grid;gap:8px;background:var(--sunk);border-radius:8px;padding:12px}
.cday{display:inline-flex;gap:4px;align-items:center;font-weight:700;font-size:.9rem}
.wk{display:grid;gap:6px}
.wkrow{display:grid;grid-template-columns:2.6em minmax(0,1fr) 4.4em;gap:8px;align-items:center;border:0;background:none;padding:4px;border-radius:6px;text-align:left}
.wkrow:hover,.wkrow.sel{background:var(--sunk)}
.wkd{font:700 .85rem var(--f-display)}
.wkh{font:600 .75rem var(--f-mono);color:var(--muted);text-align:right}
.wkbar{display:flex;gap:2px;height:16px;border-radius:4px;overflow:hidden}
.wkbar i{display:block;min-width:2px}

/* syllabus */
.subjtabs{display:flex;gap:8px;flex-wrap:wrap}
.stab{display:grid;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;min-width:140px;flex:1 1 140px}
.stab[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.stab .n{font-weight:700;display:flex;gap:8px;align-items:center}
.stab .p{font:600 .75rem var(--f-mono);color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.method{background:var(--sunk);border-radius:8px;padding:12px 14px;display:grid;gap:6px}
.method ul{margin:0;padding-left:1.1em}
.ragkey{display:grid;gap:8px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:560px){.ragkey{grid-template-columns:minmax(0,1fr)}}
.ragkey div{border-radius:8px;padding:8px 10px;font-size:.88rem}
.rk-R{background:var(--red-bg)}.rk-A{background:var(--amber-bg)}.rk-G{background:var(--green-bg)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filt{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:700}
.filt[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grp{display:grid;gap:2px}
.grp h3{padding:12px 6px 4px;display:flex;gap:8px;align-items:baseline}
.grp h3 .label{margin-left:auto}
.rag{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.rag button{border:0;background:none;padding:2px 7px;font:700 .7rem var(--f-mono);color:var(--muted)}
.rag button[aria-pressed="true"].R{background:var(--red);color:#fff}
.rag button[aria-pressed="true"].A{background:var(--amber);color:#fff}
.rag button[aria-pressed="true"].G{background:var(--green);color:#fff}
/* first-use questionnaire */
.ob{max-width:720px;margin:0 auto}
.obsteps{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex-wrap:wrap}
.obsteps li{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);flex:1 1 0;min-width:0}
.obsteps li span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font:700 .75rem var(--f-mono);flex:none;background:var(--surface)}
.obsteps li em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obsteps li.on{color:var(--ink);font-weight:700}.obsteps li.on span{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.obsteps li.done span{border-color:var(--green);background:var(--green);color:#fff}
@media (max-width:560px){.obsteps li:not(.on) em{display:none}}
.obcard{gap:16px;padding:22px}
.obcard .pf input,.obcard .pf select{width:100%}
.obcard .pf small{text-transform:none;letter-spacing:0;font-weight:400}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;width:max-content;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 14px;font-weight:700;font-size:.88rem;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg.sm button{padding:4px 10px;font-size:.78rem}
.obsubs{display:grid;gap:8px}
.obsub{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.obsub .dot{background:var(--c);width:12px;height:12px}
.obsub input{width:100%}
.obpapers{display:grid;gap:8px}
.obpaper{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1.3fr) auto;gap:6px;align-items:center}
@media (max-width:560px){.obpaper{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}.obpaper input[type=text]{grid-column:1/3}}
.obgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.obgrid{grid-template-columns:minmax(0,1fr)}}
.obgrid input[type=number]{width:100%;text-align:left;padding:7px 10px}
.obprev{display:grid;gap:8px;background:var(--sunk);border-radius:10px;padding:14px}
.obweek{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem}
.obweek span{display:inline-flex;gap:6px;align-items:center}.obweek small{color:var(--muted);font:600 .7rem var(--f-mono)}
.obsyl{display:grid;gap:8px}
.obsyl details{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:10px 12px}
.obsyl summary{display:flex;gap:8px;align-items:center;cursor:pointer;font-weight:700}
.obsyl summary small{color:var(--muted);font:600 .7rem var(--f-mono)}
.obsyl summary .dot{background:var(--c)}
.obsyl .cnt{margin-left:auto;font:600 .75rem var(--f-mono);color:var(--muted)}
.obsyl textarea{margin-top:10px}
.oberr{margin:0;color:var(--red);font-weight:700;font-size:.9rem}
.obnav{border-top:1px solid var(--line);padding-top:14px}
/* progress rings */
.rings{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:620px){.rings{grid-template-columns:minmax(0,1fr);justify-items:center;gap:18px}}
.bigring{position:relative;width:196px;height:196px;flex:none}
.bigring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.bigring circle{transition:stroke-opacity .5s,stroke-width .3s}
.ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:2px}
.ctr b{font:800 2.6rem/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ctr span{font:600 .74rem var(--f-mono);color:var(--muted)}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;width:100%}
.mini{display:flex;gap:10px;align-items:center;padding:8px 12px 8px 8px;border-radius:12px;background:var(--sunk);border:1px solid transparent}
.mini svg{width:44px;height:44px;transform:rotate(-90deg);flex:none}
.mini svg circle{transition:stroke-dasharray .6s ease}
.mini b{display:block;font-weight:700;font-size:.95rem}
.mini span{font:600 .74rem var(--f-mono);color:var(--muted);white-space:nowrap}
.mini.full{border-color:var(--c);background:var(--surface)}
.mini.full b{color:var(--c)}
.minis{grid-template-columns:repeat(auto-fill,minmax(178px,1fr))}

/* weighted round robin: HL subjects get 3 turns for every 2 SL turns; days are rotated so the order changes through the week */

function genWeek(subs,wd,we,blk,brk){

    const mid=n>=4?Math.floor(n/2)-1:-1,day=[];seq.forEach((k,i)=>{day.push({id:uid(),k:"study",subj:k,len:blk});if(i<n-1)day.push({id:uid(),k:"break",len:i===mid?Math.max(45,brk):brk})});out[DAYS[di]]=day});
  return out}
function parseSyl(txt){const groups=[];let g=null;
  String(txt||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{

    else{if(!g){g={h:"Topics",items:[]};groups.push(g)}g.items.push({id:"u"+uid(),t:l.replace(/^[-•*]\s*/,"")})}});
  return groups.length?groups:[{h:"Topics",items:[]}]}

/* ---------- Focus tab: real clock vs plan ---------- */
let focusDay=null;
const clk=sec=>{sec=Math.max(0,Math.round(sec/60))*60;const h=Math.floor(sec/3600)%24,m=Math.floor(sec%3600/60);return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")};
function flogFor(ds){
  const raw=((state.flog||{})[ds]||[]).filter((r,j)=>!(segOpen&&segOpen.ds===ds&&segOpen.ref===j));if(ds===iso(new Date())&&segOpen&&segOpen.ds===ds)raw.push([Math.round(segOpen.s),Math.round(secNow()),segOpen.i,segOpen.k,segOpen.subj]);
  raw.sort((a,b)=>a[0]-b[0]);const out=[];
  for(const g of raw){const l=out[out.length-1];if(l&&l[2]===g[2]&&g[0]-l[1]<=3)l[1]=Math.max(l[1],g[1]);else out.push(g.slice())}

function focusDayData(ds){

  const plan=planFor(ds),first=segs[0],t0=first[0],i0=Math.min(first[2],Math.max(0,plan.length-1));
  const ideal=[];let t=t0;for(let i=i0;i<plan.length;i++){ideal.push({s:t,e:t+plan[i].len*60,k:plan[i].k,subj:plan[i].subj,i});t+=plan[i].len*60}
  const gaps=[];for(let j=1;j<segs.length;j++){const g=segs[j][0]-segs[j-1][1];if(g>30)gaps.push({s:segs[j-1][1],e:segs[j][0],after:segs[j-1]})}
  const end=segs[segs.length-1][1],study=segs.filter(x=>x[3]==="s"),focused=study.reduce((a,x)=>a+x[1]-x[0],0);
  let longest=0,run=0,prevE=null;for(const x of segs){if(x[3]==="s"&&prevE!==null&&x[0]-prevE<=60&&run>0)run+=x[1]-x[0];else run=x[3]==="s"?x[1]-x[0]:0;longest=Math.max(longest,run);prevE=x[3]==="s"?x[1]:null}

  const idealStudy=ideal.map(x=>({s:x.s,e:x.e,k:x.k}));const actualStudy=segs.map(x=>({s:x[0],e:x[1],k:x[3]}));

function focusChart(ds,D){

  const act=D.segs.map(g=>g[3]==="s"?`<rect x="${x(g[0])}" y="72" width="${wd(g[0],g[1])}" height="24" rx="3" fill="${subC(g[4])}"><title>${esc(SUBJ[g[4]]?.short||"Study")} ${clk(g[0])}–${clk(g[1])} (${hm(Math.round((g[1]-g[0])/60))})</title></rect>`:`<rect x="${x(g[0])}" y="80" width="${wd(g[0],g[1])}" height="8" rx="2" fill="var(--muted)" fill-opacity=".5"><title>Break ${clk(g[0])}–${clk(g[1])} (${hm(Math.round((g[1]-g[0])/60))})</title></rect>`).join("");

function openCtx(id,x,y,alignRight){closeCtx();const f=findTopic(id);if(!f)return;ctxRet=document.activeElement;
  const m=document.createElement("div");m.id="ctx";m.setAttribute("role","menu");m.setAttribute("aria-label","Topic actions");
  m.innerHTML=`<button role="menuitem" data-c="todo">${todoFor(id)?"Remove from today's to-do":"Add to today's to-do"}</button><button role="menuitem" data-c="rename">Rename</button><button role="menuitem" data-c="up">Move up</button><button role="menuitem" data-c="down">Move down</button><hr><button role="menuitem" class="danger" data-c="del">Delete topic from syllabus</button>`;
  document.body.appendChild(m);const r=m.getBoundingClientRect();if(alignRight)x-=r.width;
  m.style.left=Math.max(8,Math.min(x,innerWidth-r.width-8))+"px";m.style.top=Math.max(8,Math.min(y,innerHeight-r.height-8))+"px";
  m.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;closeCtx();topicAction(b.dataset.c,id)});
  m.addEventListener("keydown",e=>{const bs=[...m.querySelectorAll("button")],i=bs.indexOf(document.activeElement);
    if(e.key==="ArrowDown"){e.preventDefault();bs[(i+1)%bs.length].focus()}else if(e.key==="ArrowUp"){e.preventDefault();bs[(i-1+bs.length)%bs.length].focus()}
    else if(e.key==="Escape"||e.key==="Tab"){e.preventDefault();closeCtx();try{ctxRet&&ctxRet.focus()}catch(x){}}});
  m.querySelector("button").focus({preventScroll:true});
}
document.addEventListener("pointerdown",e=>{if(!e.target.closest("#ctx"))closeCtx()},true);
window.addEventListener("scroll",closeCtx,{passive:true});window.addEventListener("resize",closeCtx);
app.addEventListener("contextmenu",e=>{if(current!=="syllabus"||e.target.closest("input[type=text]"))return;const r=e.target.closest(".trow");if(!r)return;e.preventDefault();openCtx(r.dataset.tid,e.clientX,e.clientY)});
app.addEventListener("keydown",e=>{if(e.key!=="Escape")return;
  if(e.target.classList.contains("renamein")){sylRename=null;render()}
  else if(e.target.classList.contains("tdin")){todoEdit=null;render()}
  else if(e.target.closest("form.addtopic")){sylAdding=null;render();const b=$(".addbtn");if(b)b.focus()}});
app.addEventListener("focusout",e=>{if(e.target.classList&&e.target.classList.contains("renamein")){const id=e.target.closest("form").dataset.rename;setTimeout(()=>commitRename(id,e.target.value),0)}});
let toastT=null;
function toast(msg,act,fn){let t=document.getElementById("toast");if(t)t.remove();t=document.createElement("div");t.id="toast";t.setAttribute("role","status");
  t.innerHTML=`<span>${esc(msg)}</span>${act?`<button type="button">${esc(act)}</button>`:""}`;document.body.appendChild(t);
  if(act)t.querySelector("button").onclick=()=>{t.remove();fn()};clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),5000)}

/* drag topics by the ⠿ handle: pointer events, so mouse, trackpad and touch all work */
let tdrag=null;
const clearTMarks=()=>document.querySelectorAll(".ov-top,.ov-bot").forEach(n=>n.classList.remove("ov-top","ov-bot"));
app.addEventListener("pointerdown",e=>{const g=e.target.closest(".tgrip");if(!g||e.button>0)return;e.preventDefault();closeCtx();
  const row=g.closest(".trow");tdrag={id:g.dataset.tgrip,row,target:null,y:e.clientY};row.classList.add("dragging");document.body.classList.add("dragging-topic");
  try{g.setPointerCapture(e.pointerId)}catch(x){}
  tdrag.timer=setInterval(()=>{if(!tdrag)return;if(tdrag.y<90)scrollBy(0,-12);else if(tdrag.y>innerHeight-60)scrollBy(0,12)},16)});
document.addEventListener("pointermove",e=>{if(!tdrag)return;e.preventDefault();tdrag.y=e.clientY;clearTMarks();tdrag.target=null;
  const el=document.elementFromPoint(e.clientX,e.clientY);if(!el)return;const grp=el.closest(".grp[data-gi]");if(!grp)return;const gi=+grp.dataset.gi;
  const r=el.closest(".trow");
  if(r){if(r.dataset.tid===tdrag.id)return;const b=r.getBoundingClientRect(),after=e.clientY>b.top+b.height/2;r.classList.add(after?"ov-bot":"ov-top");tdrag.target={gi,ref:r.dataset.tid,after};return}
  if(el.closest("h3")){grp.querySelector("h3").classList.add("ov-bot");tdrag.target={gi,ref:"^"};return}
  const end=grp.querySelector(".addtopic");if(end)end.classList.add("ov-top");tdrag.target={gi,ref:null}},{passive:false});
const endTDrag=e=>{if(!tdrag)return;clearInterval(tdrag.timer);const t=tdrag.target,id=tdrag.id;tdrag.row.classList.remove("dragging");tdrag=null;
  document.body.classList.remove("dragging-topic");clearTMarks();if(t&&e.type==="pointerup")moveTopic(id,t.gi,t.ref,t.after)};
document.addEventListener("pointerup",endTDrag);document.addEventListener("pointercancel",endTDrag);

/* Today to-dos: press and drag (mouse), or hold then drag (touch / the ⠿ handle drags at once) to reorder within a subject */
let tdd=null,tdSuppressClick=false;
function tdStart(){if(!tdd||tdd.on)return;tdd.on=true;clearTimeout(tdd.hold);tdd.row.classList.remove("lifted");tdd.row.classList.add("dragging");document.body.classList.add("dragging-topic");try{navigator.vibrate&&navigator.vibrate(15)}catch(x){}
  tdd.timer=setInterval(()=>{if(!tdd)return;if(tdd.y<90)scrollBy(0,-12);else if(tdd.y>innerHeight-60)scrollBy(0,12)},16)}
app.addEventListener("pointerdown",e=>{if(current!=="today"||e.button>0)return;const row=e.target.closest(".tdrow");if(!row||e.target.closest("input,button"))return;
  const grip=!!e.target.closest(".tdgrip"),touch=e.pointerType!=="mouse";if(!touch||grip)e.preventDefault();
  tdd={row,k:row.dataset.tdid.split("|")[0],id:row.dataset.tdid.split("|")[1],x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,on:false,touch,target:null};
  if(grip)tdStart();else if(touch)tdd.hold=setTimeout(()=>{if(tdd){tdd.row.classList.add("lifted");tdStart()}},350)});
document.addEventListener("pointermove",e=>{if(!tdd)return;tdd.x=e.clientX;tdd.y=e.clientY;const moved=Math.hypot(e.clientX-tdd.sx,e.clientY-tdd.sy);
  if(!tdd.on){if(tdd.touch){if(moved>8){clearTimeout(tdd.hold);tdd=null}return}if(moved<5)return;tdStart()}
  e.preventDefault();clearTMarks();tdd.target=null;const el=document.elementFromPoint(e.clientX,e.clientY),r=el&&el.closest(".tdrow");
  if(!r||r===tdd.row||r.dataset.tdid.split("|")[0]!==tdd.k)return;const b=r.getBoundingClientRect(),after=e.clientY>b.top+b.height/2;r.classList.add(after?"ov-bot":"ov-top");tdd.target={ref:r.dataset.tdid.split("|")[1],after}},{passive:false});
document.addEventListener("touchmove",e=>{if(tdd&&tdd.on)e.preventDefault()},{passive:false});
const tdEnd=e=>{if(!tdd)return;const d=tdd;tdd=null;clearTimeout(d.hold);clearInterval(d.timer);d.row.classList.remove("dragging","lifted");clearTMarks();document.body.classList.remove("dragging-topic");
  if(!d.on)return;tdSuppressClick=true;setTimeout(()=>tdSuppressClick=false,0);
  if(e.type==="pointerup"&&d.target){const L=state.todos[d.k],from=L.findIndex(x=>x.id===d.id);if(from<0)return;const[it]=L.splice(from,1);let i=L.findIndex(x=>x.id===d.target.ref);i=i<0?L.length:i+(d.target.after?1:0);L.splice(i,0,it);save();render()}};
document.addEventListener("pointerup",tdEnd);document.addEventListener("pointercancel",tdEnd);
document.addEventListener("click",e=>{if(tdSuppressClick){e.preventDefault();e.stopPropagation();tdSuppressClick=false}},true);
document.addEventListener("contextmenu",e=>{if(tdd&&tdd.touch)e.preventDefault()});

/* drag to reorder blocks (desktop); arrows cover touch */
let dragId=null;
const clearDrag=()=>document.querySelectorAll(".brow.over,.brow.dragging").forEach(n=>n.classList.remove("over","dragging"));
app.addEventListener("dragstart",e=>{const r=e.target.closest&&e.target.closest(".brow");if(!r)return;dragId=r.dataset.bid;r.classList.add("dragging");try{e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",dragId)}catch(x){}});
app.addEventListener("dragover",e=>{if(!dragId)return;const r=e.target.closest&&e.target.closest(".brow");if(r){e.preventDefault();document.querySelectorAll(".brow.over").forEach(n=>n.classList.remove("over"));if(r.dataset.bid!==dragId)r.classList.add("over")}else if(e.target.id==="blist")e.preventDefault()});
app.addEventListener("dragend",()=>{dragId=null;clearDrag()});
app.addEventListener("drop",e=>{
  if(!dragId)return;const L=dayArr(weekDay),from=L.findIndex(x=>x.id===dragId);const r=e.target.closest&&e.target.closest(".brow");
  if(from<0||(!r&&e.target.id!=="blist")){dragId=null;clearDrag();return}
  e.preventDefault();const[m]=L.splice(from,1);
  if(r&&r.dataset.bid!==m.id){L.splice(L.findIndex(x=>x.id===r.dataset.bid),0,m)}else if(r){L.splice(from,0,m)}else L.push(m);
  dragId=null;save();render();
});

syncTimerIdx();
route();
initStore();
</script>

<script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script></body></html>
